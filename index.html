<body>

<div class="map-title">
    <h2>UNZA Campus GIS</h2>
    <p>Interactive Web-Based GIS</p>
</div>

<div class="search-control">
    <div class="search-box">
        <input id="searchInput"
               type="text"
               placeholder="Search buildings, rooms or facilities..."
               autocomplete="off">
        <button id="searchButton" type="button">Search</button>
    </div>

    <div id="searchResults" class="search-results"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>

/* =========================================================
   1. MAP
========================================================= */

const map=L.map('map',{
    center:[-15.392,28.329],
    zoom:16,
    zoomControl:true
});

let routeLayer=null;
let navigationDestination=null;


/* =========================================================
   2. BASE MAPS
========================================================= */

const osmBase=L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19,
        zIndex:1,
        attribution:'&copy; OpenStreetMap contributors'
    }
).addTo(map);


const satelliteBase=L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        maxZoom:19,
         zIndex:1,
        attribution:'&copy; Esri'
    }
);


const cartoDark=L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {
        maxZoom:19,
         zIndex:1,
        attribution:'&copy; CARTO'
    }
);


const baseMaps={
    "OpenStreetMap":osmBase,
    "Satellite":satelliteBase,
    "Carto Dark":cartoDark
};


/* =========================================================
   3. GEOSERVER
========================================================= */
const geoserverURL =
    'https://roy-doll-calculate-corner.trycloudflare.com/geoserver/UNZA_campus/wms';
    
    /* Main published layer group */

const unzaCampusLayer=L.tileLayer.wms(
    geoserverURL,
    {
        layers:'UNZA_campus:merged unza vectors',
        format:'image/png',
        transparent:true,
        version:'1.1.1',
        styles:'',
        zIndex:100,
        t:Date.now(),
        attribution:'UNZA Geomatics Department & GeoServer'
    }
).addTo(map);

const buildingsLayer=L.tileLayer.wms(
    geoserverURL,
    {
        layers:'UNZA_campus:merged unza vectors',
        format:'image/png',
        transparent:true,
        version:'1.1.1',
        styles:'UNZA_campus:UNZA_buildings',
        zIndex:200,
        t:Date.now(),
        attribution:'UNZA Buildings'
    }
).addTo(map);

const buildingsRoomsLayer = L.tileLayer.wms(
    geoserverURL,
    {
        layers:'UNZA_campus:buildings_with_rooms_corrected',
        format:'image/png',
        transparent:true,
        version:'1.1.1',
        styles:'UNZA_campus:UNZA_buildings_rooms',
        zIndex:250,
        t:Date.now(),
        attribution:'UNZA Buildings & Rooms'
    }
).addTo(map);

const waterSourcesLayer=L.tileLayer.wms(
    geoserverURL,
    {
        layers:'UNZA_campus:merged unza vectors',
        format:'image/png',
        transparent:true,
        version:'1.1.1',
        styles:'UNZA_campus:UNZA_watersources',
        zIndex:300,
        t:Date.now(),
        attribution:'UNZA Water Sources'
    }
).addTo(map);

const roadsLayer=L.tileLayer.wms(
    geoserverURL,
    {
        layers:'UNZA_campus:roads and pathways vectors',
        format:'image/png',
        transparent:true,
        version:'1.1.1',
        styles:'UNZA_campus:UNZA_roads_and_pathways',
        zIndex:400,
        t:Date.now(),
        attribution:'UNZA Roads and Pathways'
    }
).addTo(map);

/* =========================================================
   4. LAYER CONTROL
========================================================= */

L.control.layers(
    baseMaps,
    {
        "UNZA Campus Map":unzaCampusLayer
    },
    {
        position:'bottomright',
        collapsed:false
    }
).addTo(map);


/* =========================================================
   5. SEARCH
========================================================= */

const searchLayer=
    'UNZA_campus:merged unza vectors';

let searchHighlight=null;


document
    .getElementById('searchButton')
    .addEventListener(
        'click',
        performSearch
    );


document
    .getElementById('searchInput')
    .addEventListener(
        'keydown',
        function(e){

            if(e.key==='Enter'){
                performSearch();
            }

        }
    );

document
    .getElementById('searchInput')
    .addEventListener(
        'input',
        function(){

            const query=
                this.value.trim();

            if(query.length>=2){
                searchFeatures(query);
            }
            else{
                clearSearchResults();
            }

        }
    );


/* =========================================================
   6. PERFORM SEARCH
========================================================= */

function performSearch(){

    const query=
        document
        .getElementById('searchInput')
        .value
        .trim();


    if(!query){

        showSearchMessage(
            'Please enter a building, room or facility name.'
        );

        return;
    }


    searchFeatures(query);
}

/* =========================================================
   7. SEARCH GEOSERVER USING WFS
========================================================= */

function searchFeatures(query){

    showSearchMessage('Searching...');


    const layers=[
        'UNZA_campus:merged unza vectors',
        'UNZA_campus:buildings_with_rooms_corrected'
    ];


    const searchText=
        query.toLowerCase();


    const requests=
        layers.map(function(layer){

            const params=new URLSearchParams({

                service:'WFS',

                version:'1.0.0',

                request:'GetFeature',

                typeName:layer,

                outputFormat:'application/json',

                srsName:'EPSG:4326',

                maxFeatures:'1000'

            });


            const url=
                geoserverURL.replace(
                    '/wms',
                    '/wfs'
                )+
                '?'+
                params.toString();


            console.log(
                'WFS Search URL:',
                url
            );


            return fetch(url)

                .then(function(response){

                    if(!response.ok){

                        throw new Error(
                            'GeoServer WFS request failed: '+
                            response.status
                        );

                    }

                    return response.json();

                })

                .then(function(data){

                    return (data.features||[]).map(
                        function(feature){

                            feature.searchSource=layer;

                            return feature;

                        }
                    );

                });

        });


    Promise.all(requests)

        .then(function(results){

            const features=
                results.flat();


            const matches=
                features.filter(
                    function(feature){

                        const properties=
                            feature.properties||{};


                        return Object
                            .values(properties)
                            .some(
                                function(value){

                                    return (

                                        value!==null &&

                                        value!==undefined &&

                                        String(value)
                                            .toLowerCase()
                                            .includes(
                                                searchText
                                            )

                                    );

                                }
                            );

                    }
                );


            displaySearchResults(
                matches,
                query
            );

        })

        .catch(function(error){

            console.error(
                'Search error:',
                error
            );


            showSearchMessage(
                'Search could not be completed. Check the browser console for the WFS error.'
            );

        });

}

/* =========================================================
   8. DISPLAY SEARCH RESULTS
========================================================= */

function displaySearchResults(
    features,
    query
){

    const results=
        document.getElementById(
            'searchResults'
        );


    results.innerHTML='';


    if(!features.length){

        showSearchMessage(
            'No features found for "'+
            query+
            '".'
        );

        return;
    }


    results.style.display='block';


    features
        .slice(0,20)
        .forEach(
            function(feature){

                const properties=
                    feature.properties||{};


                const isRoom=
                    properties['Room ID']||
                    properties['Room Name']||
                    properties['Room type']||
                    properties['Room No'];


                let title;


                if(isRoom){

                    title=
                        properties['Room Name']||
                        properties['Room name']||
                        properties['Room']||
                        'Room';

                }
                else{

                    title=

                        properties.Build_name||

                        properties.Build_Name||

                        properties.Name||

                        properties.Water_name||

                        properties.Gate_name||

                        properties.Land_name||

                        'Campus Feature';

                }


                let type;


                if(isRoom){

                    type=
                        'Room • '+
                        (
                            properties['Room type']||
                            properties['Room Type']||
                            'Building room'
                        );

                }
                else{

                    type=

                        properties.Category||

                        properties.Type||

                        properties.type||

                        properties.Function||

                        properties.Use||

                        properties.School||

                        'Campus feature';

                }


                const item=
                    document.createElement(
                        'div'
                    );


                item.className=
                    'search-result';


                item.innerHTML=

                    '<strong>'+
                    escapeHTML(title)+
                    '</strong>'+

                    '<small>'+
                    escapeHTML(type)+
                    '</small>';


                item.addEventListener(
                    'click',
                    function(){

                        selectSearchResult(
                            feature,
                            title
                        );

                    }
                );


                results.appendChild(item);

            }
        );

}

/* =========================================================
   9. SELECT SEARCH RESULT
========================================================= */

function selectSearchResult(
    feature,
    title
){

    if(!feature.geometry){
        return;
    }


    /* Remove previous highlight */

    if(searchHighlight){

        map.removeLayer(
            searchHighlight
        );

    }


    /* Highlight selected feature */

    searchHighlight=
        L.geoJSON(
            feature,
            {

                style:{

                    color:'#ff6600',
                    weight:4,
                    fillColor:'#ffff00',
                    fillOpacity:.65

                },

                pointToLayer:
                    function(
                        feature,
                        latlng
                    ){

                        return L.circleMarker(
                            latlng,
                            {

                                radius:9,
                                color:'#ff6600',
                                weight:3,
                                fillColor:'#ffff00',
                                fillOpacity:.8

                            }
                        );

                    }

            }
        ).addTo(map);


    /* Get feature centre */

    const center=
        getFeatureCenter(
            feature
        );


    /* Set navigation destination */

    navigationDestination=center;


    /* TEST COORDINATES */

    console.log(
        'SELECTED FEATURE:',
        title
    );

    console.log(
        'LATITUDE:',
        center.lat
    );

    console.log(
        'LONGITUDE:',
        center.lng
    );


    /* Show popup */

    L.popup({
        maxWidth:250
    })

    .setLatLng(center)

    .setContent(
        createPopup(
            feature.properties||{},
            title,
            true
        )
    )

    .openOn(map);


    /* Hide search results */

    document
        .getElementById(
            'searchResults'
        )
        .style.display='none';

}


/* =========================================================
   10. GET FEATURE CENTRE
========================================================= */

function getFeatureCenter(
    feature
){

    const layer=
        L.geoJSON(feature);


    const bounds=
        layer.getBounds();


    if(bounds.isValid()){

        return bounds.getCenter();

    }


    return map.getCenter();

}


/* =========================================================
   11. CLEAR SEARCH RESULTS
========================================================= */

function clearSearchResults(){

    const results=
        document.getElementById(
            'searchResults'
        );


    results.innerHTML='';

    results.style.display='none';

}


/* =========================================================
   12. SEARCH MESSAGE
========================================================= */

function showSearchMessage(
    message
){

    const results=
        document.getElementById(
            'searchResults'
        );


    results.innerHTML=

        '<div class="search-message">'+

        escapeHTML(message)+

        '</div>';


    results.style.display='block';

}


/* =========================================================
   13. ESCAPE HTML
========================================================= */

function escapeHTML(
    value
){

    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );

}

/* =========================================================
   14. POPUP
========================================================= */

function createPopup(
    properties,
    title,
    showNavigate=false
){

    let content=

        '<div class="popup-title">'+

        escapeHTML(title)+

        '</div>';


    /* =====================================================
       ROOM INFORMATION
    ===================================================== */

    const isRoom=

        properties['Room ID']||
        properties['Room Name']||
        properties['Room type']||
        properties['Room No'];


    if(isRoom){

        content+=

            '<div style="margin-bottom:8px;">'+

            '<strong>Building:</strong> '+
            escapeHTML(
                properties.build_name||
                properties.Build_name||
                '-'
            )+

            '<br>'+

            '<strong>Building ID:</strong> '+
            escapeHTML(
                properties.build_id||
                properties.Build_ID||
                '-'
            )+

            '<br>'+

            '<strong>School:</strong> '+
            escapeHTML(
                properties.school||
                properties.School||
                '-'
            )+

            '</div>';

    }


    /* =====================================================
       NAVIGATION BUTTON
    ===================================================== */

    if(showNavigate){

        content+=

            '<button '+
            'onclick="navigateToSelectedBuilding()" '+
            'style="width:100%;padding:7px;margin-bottom:7px;'+
            'border:none;border-radius:5px;'+
            'background:#0b3d91;color:white;cursor:pointer;">'+
            'Plot Walking Route'+
            '</button>';

    }


    /* =====================================================
       FEATURE ATTRIBUTES
    ===================================================== */

    content+=
        '<table class="feature-table">';


    for(
        const key in properties
    ){

        let value=
            properties[key];


        if(
            value===null||
            value===undefined||
            value===''
        ){

            value='-';

        }


        content+=

            '<tr>'+

            '<td>'+
            escapeHTML(key)+
            '</td>'+

            '<td>'+
            escapeHTML(value)+
            '</td>'+

            '</tr>';

    }


    content+=
        '</table>';


    return content;

}

/* =========================================================
   15. NAVIGATION
========================================================= */

function navigateToSelectedBuilding(){

    if(!navigationDestination){

        alert(
            'Please select a building first.'
        );

        return;
    }


    if(!navigator.geolocation){

        alert(
            'Your browser does not support location services.'
        );

        return;
    }


    console.log(
        'Requesting current location...'
    );


    navigator.geolocation.getCurrentPosition(

        function(position){

            const currentLon=
                position.coords.longitude;

            const currentLat=
                position.coords.latitude;


            const destinationLon=
                navigationDestination.lng;

            const destinationLat=
                navigationDestination.lat;


            console.log(
                'CURRENT LOCATION:',
                currentLat,
                currentLon
            );


            console.log(
                'DESTINATION:',
                destinationLat,
                destinationLon
            );
const routeURL = 'https://thomson-valium-utah-components.trycloudflare.com/route';

    '?start=' +
    currentLon +
    ',' +
    currentLat +
    '&end=' +
    destinationLon +
    ',' +
    destinationLat;
    
            console.log(
                'ROUTE REQUEST:',
                routeURL
            );


            fetch(routeURL)

                .then(function(response){

                    if(!response.ok){

                        throw new Error(
                            'Routing server returned '+
                            response.status
                        );

                    }

                    return response.json();

                })

                .then(function(data){

                    if(
                        !data.features||
                        !data.features.length
                    ){

                        alert(
                            'No walking route was found.'
                        );

                        return;
                    }


                    /* Remove previous route */

                    if(routeLayer){

                        map.removeLayer(
                            routeLayer
                        );

                    }


                    /* Draw route */

                    routeLayer=
                        L.geoJSON(
                            data,
                            {

                                style:{

                                    color:'#0066ff',
                                    weight:6,
                                    opacity:.9

                                }

                            }
                        ).addTo(map);


                    /* Zoom to route */

                    map.fitBounds(
                        routeLayer.getBounds(),
                        {
                            padding:[40,40]
                        }
                    );


                    /* Route information */

                    const route=
                        data.features[0]
                        .properties
                        .summary;


                    const distance=
                        (route.distance/1000)
                        .toFixed(2);


                    const duration=
                        Math.round(
                            route.duration/60
                        );


                    console.log(
                        'ROUTE DISTANCE:',
                        distance,
                        'km'
                    );


                    console.log(
                        'ROUTE TIME:',
                        duration,
                        'minutes'
                    );


                    alert(

                        'Walking route found!\n\n'+

                        'Distance: '+
                        distance+
                        ' km\n'+

                        'Estimated walking time: '+
                        duration+
                        ' minutes'

                    );

                })

                .catch(function(error){

                    console.error(
                        'ROUTE ERROR:',
                        error
                    );


                    alert(

                        'Could not calculate the walking route.\n\n'+
                        error.message

                    );

                });

        },

        function(error){

            console.error(
                'LOCATION ERROR:',
                error
            );


            alert(

                'Could not get your current location.\n\n'+
                'Please allow location access in your browser.'

            );

        },

        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

        }

    );

}


/* =========================================================
   16. GET FEATURE INFO
========================================================= */

map.on(
    'click',
    function(e){

        const size=
            map.getSize();


        const bounds=
            map.getBounds();


        const sw=
            bounds.getSouthWest();


        const ne=
            bounds.getNorthEast();


        const params={

            service:'WMS',

            version:'1.1.1',

            request:'GetFeatureInfo',

            layers:
                'UNZA_campus:merged unza vectors',

            query_layers:
                'UNZA_campus:merged unza vectors',

            styles:'',

            bbox:
                sw.lng+
                ','+
                sw.lat+
                ','+
                ne.lng+
                ','+
                ne.lat,

            width:size.x,

            height:size.y,

            srs:'EPSG:4326',

            info_format:'application/json',

            feature_count:20,

            buffer:10,

            x:
                Math.round(
                    e.containerPoint.x
                ),

            y:
                Math.round(
                    e.containerPoint.y
                )

        };


        const url=
            geoserverURL+
            '?'+
            new URLSearchParams(
                params
            ).toString();


        fetch(url)

            .then(function(response){

                if(!response.ok){

                    throw new Error(
                        'GetFeatureInfo failed'
                    );

                }

                return response.json();

            })

            .then(function(data){

                if(
                    !data.features||
                    !data.features.length
                ){

                    return;

                }


                console.log(
                    'Features returned:',
                    data.features
                );


                let feature=null;

                let featureTitle=
                    'Campus Feature';


                /* BUILDING */

                feature=
                    data.features.find(
                        function(f){

                            const p=
                                f.properties||{};


                            return (

                                p.Build_ID||

                                p.Build_name||

                                p.Build_Name

                            );

                        }
                    );


                if(feature){

                    featureTitle=
                        'Building';

                }


                /* WATER SOURCE */

                if(!feature){

                    feature=
                        data.features.find(
                            function(f){

                                const p=
                                    f.properties||{};


                                return (

                                    p.Water_ID||

                                    p.Water_name

                                );

                            }
                        );


                    if(feature){

                        featureTitle=
                            'Water Source';

                    }

                }


                /* LAND USE */

                if(!feature){

                    feature=
                        data.features.find(
                            function(f){

                                const p=
                                    f.properties||{};


                                return (

                                    p.Land_ID||

                                    p.Use||

                                    p.Name

                                );

                            }
                        );


                    if(feature){

                        featureTitle=
                            'Land Use';

                    }

                }


                /* FALLBACK */

                if(!feature){

                    feature=
                        data.features[0];

                }


                const properties=
                    feature.properties||{};


                /* POPUP */

                L.popup({

                    maxWidth:220,

                    minWidth:150,

                    className:
                        'small-feature-popup'

                })

                .setLatLng(
                    e.latlng
                )

                .setContent(
                    createPopup(
                        properties,
                        featureTitle
                    )
                )

                .openOn(map);


                /* ROOM PLACEHOLDER */

                if(

                    properties.Build_ID||

                    properties.Build_name||

                    properties.Build_Name

                ){

                    console.log(
                        'Room information placeholder: room data will be added later.'
                    );

                }

            })

            .catch(function(error){

                console.error(
                    'GetFeatureInfo error:',
                    error
                );

            });

    }
);
</script>
</body>
</html>
